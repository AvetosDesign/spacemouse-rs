[package]
name = "spacemouse"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Cross-platform raw HID capture for 3Dconnexion SpaceMouse devices"
repository = "https://github.com/AvetosDesign/spacemouse-rs"

[lib]
crate-type = ["lib"]

[features]
fail-on-warnings = []

[dependencies]
# Cross-platform HID access
# Uses hidraw on Linux, IOHIDManager on macOS, and hid.dll on Windows.
# HID access is not written in pure Rust.  This bundles a copy of the hidapi
# source code and compiles it as part of 'cargo build' using the cc crate.
# (See the crate's README.md for why that's fine even for a permissively
# licensed crate.)
hidapi = "2"
